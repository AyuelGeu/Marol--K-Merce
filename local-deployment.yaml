apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: backend
    template:
      metadata:
        labels:
          app: backend
      spec:
        containers:
          - name: backend
            image: backend:latest
            imagePullPlocy: Never
            ports:
              - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
type: LoadBalancer
  selector:
    app: backend
  ports:
  -port: 5000
    targetPort: 5000
    